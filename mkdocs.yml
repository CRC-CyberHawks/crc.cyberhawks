site_name: crc.cyberhawks
site_url: https://crc-cyberhawks.gethub.io/crc.cyberhawks/
theme:
  name: material
  logo: assets/logo.png.png
  favicon: assets/favicon.png.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: blue
    accent: orange
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - About & Background: about.md
  - Resources & Tools: resources.md
  - Schedule & Calendar: schedule.md
  - Competition Gallery: gallery.md
